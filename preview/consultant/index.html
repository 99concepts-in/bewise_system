<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#DCE2F5" />
    <meta name="description" content="BeWise consultant workspace for Jitu Bhaiya: today's sessions, people, remedies and growth." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BeWise" />
    <title>BeWise Consultant</title>
    <link rel="icon" href="./favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- self-hosted fonts: no third-party round trips; the variable font covers every weight -->
    <link rel="preload" href="./fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" as="image" href="./img/jitu.webp" />
    <style>
      /* critical shell: paints instantly, before any JavaScript */
      html,body{margin:0;background:#FAF9F5;color:#182957;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
      body::before{content:'';position:fixed;inset:0 0 auto 0;height:420px;z-index:-1;background:linear-gradient(180deg,#DCE2F5 0%,rgba(250,249,245,0) 100%)}
      .boot{max-width:560px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 16px 0}
      .boot-top{display:flex;align-items:center;gap:12px;height:56px;margin-bottom:8px}
      .boot-top img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 3px #fff}
      .boot-top b{font-size:18px;font-weight:800}
      .boot h1{font-size:29px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:8px 0 14px}
      .boot i{display:block;border-radius:32px;background:#fff;box-shadow:0 8px 24px rgba(24,41,87,.06);margin-bottom:14px}
      .boot i.a{height:300px}.boot i.b{height:190px}
      @media (min-width:960px){.boot{margin-left:max(256px,calc(50% - 300px));max-width:760px;padding-top:24px}}
    </style>
    <script type="module" crossorigin src="./assets/index-CQY4lJyU.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CjoWvB6l.css">
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true">
        <div class="boot-top"><img src="./img/jitu.webp" width="44" height="44" alt="" /><b>BeWise</b></div>
        <h1>Namaste, Jitu Bhaiya.</h1>
        <i class="a"></i><i class="b"></i>
      </div>
    </div>
    <noscript>Please turn on JavaScript to use the BeWise consultant app.</noscript>
  </body>
</html>
